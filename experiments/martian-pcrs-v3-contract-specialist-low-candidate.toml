id = "martian-pcrs-v3-contract-specialist-low-candidate"
description = "PCRS v3 candidate-pool expansion test: same repo-aware PCRS/Codex low harness as v2, with only the reviewer prompt specialized toward contract, integration, migration, auth, and runtime invariant defects. Unofficial local smoke, not an official benchmark score."
suite = "martian-offline"
limit = 50
offset = 0
replay_mode = "cache-first"
max_cost_usd = 0.00
max_duration_seconds = 28800

[[reviewers]]
id = "pcrs-codex-contract-specialist-low"
type = "command"
enabled = true
include_workspace = true
required_executable = "codex"
command = "elixir"
args = ["scripts/reviewers/pcrs_codex_proof_reviewer.exs"]
timeout_ms = 210000
stdout_limit = 262144
stderr_limit = 262144
cwd = "."
requires_network = true
requires_secrets = []
cost_model = "chatgpt_auth_or_user_provider"
capabilities = ["llm", "codex_cli", "proof_gate", "refutation", "repo_workspace", "contract_specialist", "integration_specialist"]
evidence = "static_repo_contract_proof"
refutation = "public_proof_refuter"
ranking = "expected_value_stub"
env = ["SUGARY_REVIEWER_ID=pcrs-codex-contract-specialist-low", "SUGARY_CODEX_MODEL=gpt-5.5", "SUGARY_CODEX_REASONING_EFFORT=low", "SUGARY_CODEX_MAX_CLAIMS=4", "SUGARY_CODEX_INNER_TIMEOUT_MS=150000", "SUGARY_PCRS_MAX_CLAIMS=4", "SUGARY_PCRS_MIN_CODEX_CONFIDENCE=0.70", "SUGARY_PCRS_INNER_REVIEWER_SCRIPT=scripts/reviewers/codex_repo_reviewer.exs", "SUGARY_CODEX_REVIEW_FOCUS=Look especially for API contract mismatches, schema/migration backcompat breaks, permission checks on the wrong object, tenant isolation leaks, lifecycle/race/idempotency defects, feature-flag inversions, timezone or pagination boundary errors, and integration assumptions that require cross-file repository context. Do not comment on style. Do not invent requirements; every claim still needs a concrete failure path and introduced-by-this-PR argument."]
