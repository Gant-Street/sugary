id = "martian-pcrs-v3-repo-grep-low-candidate"
description = "PCRS v3 candidate-pool expansion test: repo-aware PCRS with precomputed changed-file rg context and compact input. Single moved variable from v2 is the explicit repo-grep context tool. Unofficial local smoke, not an official benchmark score."
suite = "martian-offline"
limit = 50
offset = 0
replay_mode = "cache-first"
max_cost_usd = 0.00
max_duration_seconds = 28800

[[reviewers]]
id = "pcrs-codex-repo-grep-low"
type = "command"
enabled = true
include_workspace = true
required_executable = "codex"
command = "elixir"
args = ["scripts/reviewers/pcrs_codex_proof_reviewer.exs"]
timeout_ms = 210000
stdout_limit = 262144
stderr_limit = 262144
cwd = "."
requires_network = true
requires_secrets = []
cost_model = "chatgpt_auth_or_user_provider"
capabilities = ["llm", "codex_cli", "proof_gate", "refutation", "repo_workspace", "repo_grep_context", "compact_input"]
evidence = "static_repo_grep_proof"
refutation = "public_proof_refuter"
ranking = "expected_value_stub"
env = ["SUGARY_REVIEWER_ID=pcrs-codex-repo-grep-low", "SUGARY_CODEX_MODEL=gpt-5.5", "SUGARY_CODEX_REASONING_EFFORT=low", "SUGARY_CODEX_MAX_CLAIMS=4", "SUGARY_CODEX_INNER_TIMEOUT_MS=150000", "SUGARY_PCRS_MAX_CLAIMS=4", "SUGARY_PCRS_MIN_CODEX_CONFIDENCE=0.70", "SUGARY_PCRS_INNER_REVIEWER_SCRIPT=scripts/reviewers/codex_repo_grep_reviewer.exs", "SUGARY_CODEX_GREP_MAX_DIFF_CHARS=18000", "SUGARY_CODEX_GREP_MAX_LINES=120"]
