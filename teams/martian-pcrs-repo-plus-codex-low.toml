id = "martian-pcrs-repo-plus-codex-low"
description = "Hybrid Martian candidate: raw low-reasoning Codex plus strict repo-aware PCRS proof/refutation candidates, merged and ranked by Sugary."
failure_policy = "continue"
merge_strategy = "dedupe_by_key_location_and_claim"
max_published_claims = 3
metadata = { suite = "martian-offline", purpose = "long-form-autoresearch-v0", unofficial = true }
artifact_fields = ["raw_claims", "merged_claims", "provenance", "contributions"]

[[reviewers]]
id = "codex-gpt-5.5-low"
type = "command"
enabled = true
required_executable = "codex"
command = "elixir"
args = ["scripts/reviewers/codex_exec_reviewer.exs"]
timeout_ms = 180000
stdout_limit = 262144
stderr_limit = 262144
cwd = "."
requires_network = true
requires_secrets = []
cost_model = "chatgpt_auth_or_user_provider"
capabilities = ["llm", "codex_cli", "diff_only"]
env = ["SUGARY_REVIEWER_ID=codex-gpt-5.5-low", "SUGARY_CODEX_MODEL=gpt-5.5", "SUGARY_CODEX_REASONING_EFFORT=low", "SUGARY_CODEX_MAX_CLAIMS=3", "SUGARY_CODEX_INNER_TIMEOUT_MS=120000"]

[[reviewers]]
id = "pcrs-codex-repo-low-strict"
type = "command"
enabled = true
include_workspace = true
required_executable = "codex"
command = "elixir"
args = ["scripts/reviewers/pcrs_codex_proof_reviewer.exs"]
timeout_ms = 240000
stdout_limit = 262144
stderr_limit = 262144
cwd = "."
requires_network = true
requires_secrets = []
cost_model = "chatgpt_auth_or_user_provider"
capabilities = ["llm", "codex_cli", "proof_gate", "refutation", "repo_workspace", "search", "strict_ranking"]
evidence = "static_repo_proof"
refutation = "public_proof_refuter"
ranking = "expected_value_stub"
env = ["SUGARY_REVIEWER_ID=pcrs-codex-repo-low-strict", "SUGARY_CODEX_MODEL=gpt-5.5", "SUGARY_CODEX_REASONING_EFFORT=low", "SUGARY_CODEX_MAX_CLAIMS=3", "SUGARY_CODEX_INNER_TIMEOUT_MS=150000", "SUGARY_PCRS_MAX_CLAIMS=3", "SUGARY_PCRS_MIN_CODEX_CONFIDENCE=0.82", "SUGARY_PCRS_INNER_REVIEWER_SCRIPT=scripts/reviewers/codex_repo_reviewer.exs"]
